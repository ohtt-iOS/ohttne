<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ForBand — App Store에서 받기</title>
<meta name="description" content="밴드 연습의 모든 것. 플레이어·메트로놈·튜너·녹음·세트리스트를 하나에. App Store에서 받으세요.">
<meta property="og:title" content="ForBand — 밴드 연습의 모든 것">
<meta property="og:description" content="플레이어·메트로놈·튜너·녹음·세트리스트를 하나에.">
<meta property="og:image" content="https://www.ohttne.com/forband/icon.png">
<meta property="og:url" content="https://www.ohttne.com/forband/app-store/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="/forband/icon.png">
<link rel="apple-touch-icon" href="/forband/icon.png">
<link rel="canonical" href="https://www.ohttne.com/forband/app-store/">
<script>
  // 즉시 App Store로 이동. 나라별 스토어는 Apple이 자동으로 잡아준다.
  var TARGET = "https://apps.apple.com/app/id6793964973";
  try { window.location.replace(TARGET); } catch (e) { window.location.href = TARGET; }
</script>
<noscript><meta http-equiv="refresh" content="0; url=https://apps.apple.com/app/id6793964973"></noscript>
<style>
  :root{
    --bg:#ffffff;
    --ink:#111113;
    --ink-2:#6e6e73;
    --tile:#f4f4f5;
    --accent:#3478f6;
    --thumb:#c9dcf2;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f0f11; --ink:#f5f5f7; --ink-2:#9a9aa0; --tile:#1c1c1f; --thumb:#1e2a3a; }
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
    padding:32px 20px calc(32px + env(safe-area-inset-bottom));
  }
  .card{ width:100%; max-width:380px; text-align:center; }
  .icon{
    width:104px; height:104px; border-radius:23%;
    display:block; margin:0 auto 20px;
    box-shadow:0 6px 24px rgba(0,0,0,.14);
    background:var(--thumb);
  }
  h1{ margin:0 0 6px; font-size:24px; font-weight:700; letter-spacing:-.02em; }
  .sub{ margin:0 0 28px; font-size:15px; line-height:1.5; color:var(--ink-2); }
  .btn{
    display:block; padding:16px 20px; border-radius:14px;
    background:var(--accent); color:#fff; text-decoration:none;
    font-size:17px; font-weight:600; letter-spacing:-.01em;
  }
  .btn:active{ opacity:.85; }
  .note{
    margin:18px 0 0; font-size:13px; line-height:1.6; color:var(--ink-2);
    padding:12px 14px; border-radius:12px; background:var(--tile);
    display:none;
  }
  .note.show{ display:block; }
  .foot{ margin:26px 0 0; font-size:12px; color:var(--ink-2); }
  .foot a{ color:var(--ink-2); }
</style>
</head>
<body>
  <main class="card">
    <img class="icon" src="/forband/icon.png" alt="ForBand 앱 아이콘" width="104" height="104">
    <h1>ForBand</h1>
    <p class="sub">밴드 연습의 모든 것.<br>App Store로 이동 중입니다…</p>

    <a class="btn" id="go" href="https://apps.apple.com/app/id6793964973">App Store에서 열기</a>

    <p class="note" id="note">
      화면이 그대로면 오른쪽 아래 <b>···</b> 를 눌러<br><b>“외부 브라우저에서 열기”</b>를 선택해 주세요.
    </p>

    <p class="foot">
      <a href="https://ohtt-ios.github.io/ForBand-public/">앱 소개</a> ·
      <a href="https://ohtt-ios.github.io/ForBand-public/privacy.html">개인정보 처리방침</a>
    </p>
  </main>

<script>
  // 자동 이동이 막히는 앱 내장 브라우저(인스타그램·페이스북 등)에서는 안내 문구를 띄운다.
  (function () {
    var ua = navigator.userAgent || "";
    var inApp = /Instagram|FBAN|FBAV|FB_IAB|KAKAOTALK|NAVER\(inapp|Line\//i.test(ua);
    if (inApp) {
      document.getElementById("note").classList.add("show");
    }
    // 첫 시도가 삼켜졌을 수 있으니 한 번 더.
    setTimeout(function () {
      if (!document.hidden) { window.location.href = TARGET; }
    }, 1200);
  })();
</script>
</body>
</html>
