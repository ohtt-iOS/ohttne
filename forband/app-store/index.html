<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ForBand — App Store에서 받기</title>
<meta name="description" content="밴드 연습의 모든 것. 플레이어·메트로놈·튜너·녹음·세트리스트를 하나에. App Store에서 받으세요.">
<meta property="og:title" content="ForBand — 밴드 연습의 모든 것">
<meta property="og:description" content="플레이어·메트로놈·튜너·녹음·세트리스트를 하나에.">
<meta property="og:image" content="https://www.ohttne.com/forband/icon.png">
<meta property="og:url" content="https://www.ohttne.com/forband/app-store/">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="/forband/icon.png">
<link rel="apple-touch-icon" href="/forband/icon.png">
<link rel="canonical" href="https://www.ohttne.com/forband/app-store/">
<style>
  :root{
    --bg:#ffffff;
    --ink:#111113;
    --ink-2:#6e6e73;
    --tile:#f4f4f5;
    --line:#e5e5ea;
    --accent:#3478f6;
    --thumb:#c9dcf2;
    --iab-accent:#3478f6; /* 인앱 탈출 안내 시트의 주 버튼 색 */
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f0f11; --ink:#f5f5f7; --ink-2:#9a9aa0; --tile:#1c1c1f; --line:#2c2c30; --thumb:#1e2a3a; }
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh;
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR",sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
    padding:36px 20px calc(36px + env(safe-area-inset-bottom));
  }
  .card{ width:100%; max-width:380px; text-align:center; }
  .icon{
    width:104px; height:104px; border-radius:23%;
    display:block; margin:0 auto 20px;
    box-shadow:0 6px 24px rgba(0,0,0,.14);
    background:var(--thumb);
  }
  h1{ margin:0 0 6px; font-size:25px; font-weight:800; letter-spacing:-.02em; }
  .sub{ margin:0 0 26px; font-size:15px; line-height:1.55; color:var(--ink-2); }
  .btn{
    display:block; padding:16px 20px; border-radius:14px;
    background:var(--accent); color:#fff; text-decoration:none;
    font-size:17px; font-weight:600; letter-spacing:-.01em;
    border:0; width:100%; font-family:inherit; cursor:pointer;
  }
  .btn:active{ opacity:.85; }
  .hint{
    margin:16px 0 0; padding:14px 16px; border-radius:14px;
    background:var(--tile); text-align:left; display:none;
    font-size:13px; line-height:1.65; color:var(--ink-2);
  }
  .hint.show{ display:block; }
  .foot{ margin:24px 0 0; font-size:12px; color:var(--ink-2); }
  .foot a{ color:var(--ink-2); }
</style>
</head>
<body>
  <main class="card">
    <img class="icon" src="/forband/icon.png" alt="ForBand 앱 아이콘" width="104" height="104">
    <h1>ForBand</h1>
    <p class="sub" id="sub">밴드 연습의 모든 것.<br>메트로놈 · 튜너 · 연습 플레이어 · 세트리스트</p>

    <a class="btn" id="go" href="https://apps.apple.com/app/id6793964973">App Store에서 받기</a>

    <p class="hint" id="hint">
      지금은 앱 안의 브라우저예요. 위 버튼을 누르면 기본 브라우저로 App Store를 엽니다.
    </p>

    <p class="foot">
      <a href="https://ohtt-ios.github.io/ForBand-public/">앱 소개</a> ·
      <a href="https://ohtt-ios.github.io/ForBand-public/privacy.html">개인정보 처리방침</a>
    </p>
  </main>

<script src="/assets/inapp-browser.js"></script>
<script>
(function () {
  var APPSTORE = "https://apps.apple.com/app/id6793964973";

  // 인앱 브라우저 탈출은 inapp-browser.js가 #go 링크에 자동으로 붙는다
  // (apps.apple.com 링크를 위임 처리). 여기서는 안내와 자동 이동만 맡는다.
  var inApp = InAppBreakout.isInApp();

  if (inApp) document.getElementById("hint").classList.add("show");

  // 자동 이동은 페이지가 그려진 뒤에. 예전엔 <head>에서 바로 이동시켜
  // 인앱 브라우저가 그 이동을 막으면 흰 화면만 남았다.
  //
  // 인앱 브라우저에서는 자동 이동을 아예 하지 않는다 — 탈출 스킴은 사용자
  // 탭(제스처) 안에서 호출해야 iOS가 받아준다. 타이머에서 쏘면 무시된다.
  window.addEventListener("load", function () {
    if (inApp) return;
    setTimeout(function () {
      if (!document.hidden) window.location.replace(APPSTORE);
    }, 400);
  });
})();
</script>
</body>
</html>
